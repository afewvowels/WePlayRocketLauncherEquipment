[item-name]
wp-personal-rocket-launcher-equipment=Personal rocket launcher

[equipment-name]
wp-personal-rocket-launcher-equipment=Personal rocket launcher

[item-description]
wp-personal-rocket-launcher-equipment=Automatically fires rockets at nearby enemies. Loads rockets from your main inventory one at a time, best type first.

[controls]
prl-toggle=Toggle personal rocket launcher

[mod-setting-name]
prl-range=Rocket launcher range
prl-cooldown=Rocket launcher cooldown (ticks)
prl-atomic-min-range=Atomic minimum range
prl-allow-atomic=Allow atomic rockets
prl-ammo-priority=Rocket priority

[mod-setting-description]
prl-range=Base targeting range in tiles. Quality adds 10% per level.
prl-cooldown=Ticks between shots for each launcher. 60 ticks = 1 second.
prl-atomic-min-range=Atomic rockets won't be fired at enemies closer than this many tiles.
prl-allow-atomic=Lets your launchers load atomic bombs (and modded nuclear or antimatter rockets). Off by default!
prl-ammo-priority=Comma-separated rocket names, best first. Rocket types not listed are used after these. Atomic rockets are only used when they're allowed.

[prl]
enabled=Rocket launcher ON
disabled=Rocket launcher OFF
